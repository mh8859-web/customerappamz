<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Offline - AMAZ PM</title>
  <style>
    body { font-family: Inter, sans-serif; display:flex; align-items:center; justify-content:center; height:100vh; margin:0; background:#F7F9FA; color:#0F1419; }
    .card { background:#fff; padding:24px; border-radius:12px; box-shadow:0 8px 30px rgba(0,0,0,0.08); text-align:center; max-width:420px; }
    .spinner { width:36px; height:36px; border:4px solid #EFF3F4; border-top-color:#1D9BF0; border-radius:50%; animation:spin .8s linear infinite; margin:12px auto; }
    @keyframes spin { to { transform:rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <div style="font-size:20px;font-weight:600">You're offline</div>
    <div style="margin-top:8px;color:#536471">Check your internet connection and reload the app.</div>
    <div class="spinner" role="img" aria-label="loading"></div>
  </div>
</body>
</html>
