<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Offline - AMAZ PM</title>
  <style>
    body { 
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      height: 100vh;
      margin: 0;
      background-color: #F7F9FA;
      color: #0F1419;
    }
    .card {
      background-color: #FFFFFF;
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      text-align: center;
      max-width: 420px;
      width: 90%;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 4px solid #EFF3F4;
      border-top-color: #1D9BF0;
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin: 20px auto 0;
    }
    h1 {
      font-family: 'Lexend', sans-serif;
      font-size: 22px;
      font-weight: 600;
      margin: 0 0 8px;
    }
    p {
      color: #536471;
      margin: 0;
    }
    @keyframes spin { 
      to { transform: rotate(360deg); } 
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>You're Currently Offline</h1>
    <p>Please check your internet connection. The app will load as soon as you're back online.</p>
    <div class="spinner" role="img" aria-label="loading"></div>
  </div>
</body>
</html>
