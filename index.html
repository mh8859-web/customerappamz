<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>AMAZ | Interior Management</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Specific weights requested: Poppins (400-700) and Exo 2 (700-800) -->
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'brand-blue': '#2563EB',
              'brand-blue-light': '#F8FAFF', 
              'brand-blue-dark': '#1D4ED8',
              'brand-gold': '#D4AF37',
              'brand-gold-light': '#F4E7B1',
              'brand-gold-dark': '#B69121',
              'brand-dark': '#0F172A',
              'page-bg': '#F8FAFC',
              'surface': '#FFFFFF',
              'secondary': '#F1F5F9',
              'secondary-hover': '#E2E8F0',
              'border-color': '#F1F5F9',
              'border-luxury': 'rgba(212, 175, 55, 0.15)',
              'text-primary': '#1E293B',
              'text-secondary': '#64748B',
              'accent-success': '#10B981',
              'accent-warning': '#F59E0B',
              'accent-danger': '#EF4444',
            },
            fontFamily: {
              sans: ['Poppins', 'Arial', 'sans-serif'],
              display: ['"Exo 2"', 'Arial', 'sans-serif'],
            },
            borderRadius: {
              'xl': '12px',
              '2xl': '20px',
              '3xl': '32px',
            },
            boxShadow: {
              'soft': '0 2px 10px -3px rgba(0, 0, 0, 0.04), 0 4px 6px -2px rgba(0, 0, 0, 0.02)',
              'card': '0 10px 25px -12px rgba(30, 41, 59, 0.08)',
              'button': '0 8px 20px -6px rgba(37, 99, 235, 0.25)',
              'premium': '0 20px 40px -15px rgba(30, 41, 59, 0.08)',
              'gold-glow': '0 0 25px -5px rgba(212, 175, 55, 0.4)',
              'modal': '0 25px 60px -12px rgba(30, 41, 59, 0.2)',
            },
            animation: {
              'reveal': 'reveal 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards',
              'glow-pulse': 'glowPulse 3s infinite',
            },
            keyframes: {
              reveal: {
                '0%': { opacity: 0, transform: 'translateY(20px) scale(0.98)' },
                '100%': { opacity: 1, transform: 'translateY(0) scale(1)' },
              },
              glowPulse: {
                '0%, 100%': { opacity: 0.8, filter: 'brightness(1)' },
                '50%': { opacity: 1, filter: 'brightness(1.3)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #F8FAFC;
        color: #1E293B;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }
      .animate-in { animation: reveal 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
      .luxury-glass {
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(16px);
        border: 1px solid rgba(212, 175, 55, 0.2);
      }
      .no-scrollbar::-webkit-scrollbar { display: none !important; }
      .no-scrollbar { -ms-overflow-style: none !important; scrollbar-width: none !important; }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.3.1",
        "react/": "https://esm.sh/react@18.3.1/",
        "react-dom": "https://esm.sh/react-dom@18.3.1",
        "react-dom/": "https://esm.sh/react-dom@18.3.1/",
        "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
        "react-router-dom": "https://esm.sh/react-router-dom@6.22.3?deps=react@18.3.1",
        "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.39.8",
        "recharts": "https://esm.sh/recharts@2.12.3?deps=react@18.3.1",
        "vite": "https://esm.sh/vite@^7.3.0",
        "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
      }
    }
    </script>
  </head>
  <body class="font-sans">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
